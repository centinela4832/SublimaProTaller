name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK Debug
        run: gradle assembleDebug --no-daemon

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: SublimaPro-Taller-APK
          path: app/build/outputs/apk/debug/app-debug.apk
